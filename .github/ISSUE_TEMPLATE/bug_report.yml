name: Bug report
description: 发现 bug？帮我们复现它（中文或英文）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢报告！请尽量填写完整，复现信息越全越容易修复。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件控制台版本（面板「已安装」里可见）与 DSH 版本
      placeholder: 例如 dsh-plugin-console 0.3.24 / DSH 0.1.1-rc.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 1. … 2. … 3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 报错全文或截图（请脱敏密钥/token）
      render: text
  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统 + 浏览器
      placeholder: Windows 11 / Chrome
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索现有 Issues，没有重复
          required: true
        - label: 我已按模板填写完整信息
          required: true
